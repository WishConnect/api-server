spring:
  datasource:
    url: ${STAGING_DB_URL}
    username: ${STAGING_DB_USERNAME}
    password: ${STAGING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${STAGING_REDIS_HOST}
      port: ${STAGING_REDIS_PORT:6379}
      database: ${STAGING_REDIS_DATABASE:1}
      password: ${STAGING_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: 127.0.0.1
    port: 1025
    username: staging
    password: staging
    properties.mail.smtp.auth: false
server:
  address: 127.0.0.1
  port: 18081
jwt:
  secret: ${STAGING_JWT_SECRET}
app:
  cors.allowed-origins: http://localhost:3000
  # 인스턴스 역할로 운영 S3에 접근하지 않도록 명시적인 비운영 자격증명을 사용한다.
  s3:
    access-key: staging-upload-disabled
    secret-key: staging-upload-disabled
    bucket: wishconnect-staging-disabled
scholarship:
  sync.scheduled: false
  pipeline.review-enabled: true
notification.scheduled: false
management.health.mail.enabled: false
springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true
kakao:
  client-id: staging-disabled
  client-secret: staging-disabled
  redirect-uri: http://localhost:18081/staging-disabled
google:
  client-id: staging-disabled
  client-secret: staging-disabled
  redirect-uri: http://localhost:18081/staging-disabled
naver:
  client-id: staging-disabled
  client-secret: staging-disabled
  redirect-uri: http://localhost:18081/staging-disabled
  search:
    client-id: ${STAGING_NAVER_SEARCH_CLIENT_ID:staging-disabled}
    client-secret: ${STAGING_NAVER_SEARCH_CLIENT_SECRET:staging-disabled}
