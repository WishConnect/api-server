spring:
  application:
    name: wishconnect
  profiles:
    # 민감정보(DB 접속정보 등)는 application-local.yml / application-prod.yml 로 분리 (gitignore 대상)
    active: local
  jpa:
    # PostgreSQL 사용 (Hibernate 6 가 드라이버로 Dialect 자동 감지)
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # AWS SES SMTP 엔드포인트 (username/password 는 민감정보라 환경별 yml 로 분리)
    host: ${MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  # 문서를 끄려면 배포 환경변수에 SWAGGER_ENABLED=false 만 주면 된다(운영 노출 차단용 스위치).
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none   # 태그 접힌 상태로 시작(엔드포인트가 많아 가독성 우선)

# 배포 헬스체크용 (/actuator/health 만 노출)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT 공통 정책 (만료시간). secret 은 민감정보라 application-local/prod.yml + 환경변수로 주입
jwt:
  access-token-validity: 1800000      # 30분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

# 카카오 OAuth 공통(비민감) 엔드포인트. client-id/secret/redirect-uri 는 환경별 yml 로 분리
kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

# 구글 OAuth 공통(비민감) 엔드포인트
google:
  token-uri: https://oauth2.googleapis.com/token
  user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# 네이버 OAuth 공통(비민감) 엔드포인트
naver:
  token-uri: https://nid.naver.com/oauth2.0/token
  user-info-uri: https://openapi.naver.com/v1/nid/me

# LLM(Anthropic Claude) 공통 설정. API 키는 ANTHROPIC_API_KEY 환경변수로 주입.
llm:
  anthropic:
    interview-model: claude-haiku-4-5   # STEP1 사전 인터뷰 세부 질문 생성 (빠르고 저렴)
    draft-model: claude-sonnet-5        # STEP2 자기소개서 초안 생성 (문체·품질 중요)
    max-tokens: 4096

# 장학금 공공데이터 동기화 배치 (API 키 등 나머지 scholarship.api.* 는 환경별 주입)
scholarship:
  sync:
    scheduled: ${SCHOLARSHIP_SYNC_SCHEDULED:true}   # false 면 일일 배치 비활성화
    cron: ${SCHOLARSHIP_SYNC_CRON:0 0 23 * * *}     # 매일 밤 11시 (Asia/Seoul)
  collect:
    univ:
      # 대학 장학공지 수집 대상 (공통 CMS: 목록 subview.do + 상세 artclView.do 패턴만 지원)
      sites:
        - code: konkuk
          provider: 건국대학교
          source: KONKUK_NOTICE   # 기존 수집분과의 멱등 호환을 위해 유지
          list-url: https://www.konkuk.ac.kr/konkuk/2239/subview.do
          article-path: /bbs/konkuk/235/
        - code: hallym
          provider: 한림대학교
          source: UNIV_HALLYM
          list-url: https://www.hallym.ac.kr/hallym/1135/subview.do
          article-path: /bbs/hallym/156/
        - code: yonsei
          provider: 연세대학교
          source: UNIV_YONSEI
          # 학사·일반 공지가 섞인 통합 게시판이라 장학 분류(findClSeq=257)만 수집한다.
          list-url: https://www.yonsei.ac.kr/bbs/sc/58/artclList.do?findClSeq=257
          article-path: /bbs/sc/58/
        - code: hufs
          provider: 한국외국어대학교
          source: UNIV_HUFS
          list-url: https://www.hufs.ac.kr/bbs/hufs/2182/artclList.do
          article-path: /bbs/hufs/2182/
        - code: inu
          provider: 인천대학교
          source: UNIV_INU
          list-url: https://life.inu.ac.kr/bbs/inu/249/artclList.do
          article-path: /bbs/inu/249/
        - code: swu
          provider: 서울여자대학교
          source: UNIV_SWU
          list-url: https://www.swu.ac.kr/bbs/swu/57/artclList.do
          article-path: /bbs/swu/57/
        # 쿼리파라미터 계열(artclView 아님). 같은 페이지에 다른 게시판(학사공지 등) 링크도 있어
        # 목록 자기 게시판의 상대링크(?mode=view...)만 잡도록 ^ 로 고정한다.
        - code: sejong
          provider: 세종대학교
          source: UNIV_SEJONG
          list-url: https://www.sejong.ac.kr/kor/intro/notice7.do?mode=list
          link-pattern: '^\?mode=view&articleNo=(\d+)'
          detail-template: https://www.sejong.ac.kr/kor/intro/notice7.do?mode=view&articleNo={id}

# 애플리케이션 공통 설정
app:
  cors:
    # 브라우저 요청을 허용할 출처 목록 (테스트 프론트 등). 환경변수 CORS_ALLOWED_ORIGINS(쉼표구분)로 override
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@wish-connect.com}
  email-verification:
    code-ttl-seconds: 300       # 인증 코드 5분
    verified-ttl-seconds: 1800  # 인증완료 상태 30분(회원가입까지)
    cooldown-seconds: 60        # 재발송 제한 간격
