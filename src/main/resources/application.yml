spring:
  application:
    name: wishconnect
  profiles:
    # 민감정보(DB 접속정보 등)는 application-local.yml / application-prod.yml 로 분리 (gitignore 대상)
    active: local
  jpa:
    # PostgreSQL 사용 (Hibernate 6 가 드라이버로 Dialect 자동 감지)
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
