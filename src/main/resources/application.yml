spring:
  application:
    name: wishconnect
  profiles:
    # 민감정보(DB 접속정보 등)는 application-local.yml / application-prod.yml 로 분리 (gitignore 대상)
    active: local
  jpa:
    # PostgreSQL 사용 (Hibernate 6 가 드라이버로 Dialect 자동 감지)
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # AWS SES SMTP 엔드포인트 (username/password 는 민감정보라 환경별 yml 로 분리)
    host: ${MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    mapper:
      # 요청 JSON 의 enum 값 대소문자 관대 처리 (예: "draft" == "DRAFT")
      # 명세서가 소문자 값을 사용하는데 Java enum 은 대문자라 FE 연동 시 400 방지 목적
      accept-case-insensitive-enums: true
  servlet:
    multipart:
      # 업로드 전체 상한. 가장 큰 것이 관리자 포스터 이미지(5MB)라 거기에 맞춘다.
      # 기능별 한도는 서비스에서 따로 검사한다: 이미지 5MB(ImageStorageService),
      # 엑셀 1MB(POI 가 메모리에 올려 t3.small OOM 이력), 문의 첨부 2MB.
      # 요청 한도는 multipart 경계·필드 여유로 1MB 더 준다.
      # ⚠️ Nginx client_max_body_size 가 이보다 작으면 Nginx 가 먼저 413(HTML)을 낸다(기본 1m).
      max-file-size: 5MB
      max-request-size: 6MB

# nginx 리버스 프록시가 붙인 X-Forwarded-* 를 반영해 요청의 scheme/host/port 를 복원한다.
# 없으면 Spring 이 자기 주소를 http://localhost:8080 으로 인식해, Swagger UI(https://api.wish-connect.com)에서
# 보낸 same-origin POST/PATCH 를 교차출처로 오판하고 CORS 403 을 낸다.
# (Origin 헤더는 non-safe 메서드면 same-origin 요청에도 붙기 때문)
# 로컬은 프록시가 없어 해당 헤더가 오지 않으므로 동작에 영향 없다.
server:
  forward-headers-strategy: framework

springdoc:
  # 문서를 끄려면 배포 환경변수에 SWAGGER_ENABLED=false 만 주면 된다(운영 노출 차단용 스위치).
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none   # 태그 접힌 상태로 시작(엔드포인트가 많아 가독성 우선)

# 배포 헬스체크용 (/actuator/health 만 노출)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT 공통 정책 (만료시간). secret 은 민감정보라 application-local/prod.yml + 환경변수로 주입
jwt:
  access-token-validity: 1800000      # 30분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

# 카카오 OAuth 공통(비민감) 엔드포인트. client-id/secret/redirect-uri 는 환경별 yml 로 분리
kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  # 프론트가 요청 바디로 보낼 수 있는 redirect_uri 허용목록(콤마 구분).
  # 설정된 redirect-uri 는 자동 허용되므로, 여기엔 로컬 개발용만 둔다.
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:3000/auth/kakao/callback}

# 구글 OAuth 공통(비민감) 엔드포인트
google:
  token-uri: https://oauth2.googleapis.com/token
  user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:3000/auth/google/callback}

# 네이버 OAuth 공통(비민감) 엔드포인트
naver:
  token-uri: https://nid.naver.com/oauth2.0/token
  user-info-uri: https://openapi.naver.com/v1/nid/me
  search:
    # 로컬에서 키가 없어도 앱 기동은 가능하게 둔다. 실제 검색 호출은 빈 결과로 실패 격리된다.
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}

# LLM(Anthropic Claude) 공통 설정. API 키는 ANTHROPIC_API_KEY 환경변수로 주입.
llm:
  anthropic:
    interview-model: claude-haiku-4-5   # STEP1 사전 인터뷰 세부 질문 생성 (빠르고 저렴)
    draft-model: claude-sonnet-5        # STEP2 자기소개서 초안 생성 (문체·품질 중요)
    summary-model: claude-haiku-4-5
    parser-model: claude-haiku-4-5     # 대학 장학공지 본문 파싱 (건당 1회 호출, 저가 모델 필수)
    max-tokens: 4096

# 장학금 공공데이터 동기화 배치 (API 키 등 나머지 scholarship.api.* 는 환경별 주입)
scholarship:
  sync:
    scheduled: ${SCHOLARSHIP_SYNC_SCHEDULED:true}   # false 면 일일 배치 비활성화
    cron: ${SCHOLARSHIP_SYNC_CRON:0 0 11 * * *}     # 매일 오전 11시 (Asia/Seoul)
  collect:
    univ:
      # 대학 장학공지 수집 대상 (공통 CMS: 목록 subview.do + 상세 artclView.do 패턴만 지원)
      sites:
        - code: konkuk
          provider: 건국대학교
          source: UNIV_KONKUK
          list-url: https://www.konkuk.ac.kr/konkuk/2239/subview.do
          article-path: /bbs/konkuk/235/
          max-articles: 10
        - code: hallym
          provider: 한림대학교
          source: UNIV_HALLYM
          list-url: https://www.hallym.ac.kr/hallym/1135/subview.do
          article-path: /bbs/hallym/156/
          max-articles: 10
        - code: yonsei
          provider: 연세대학교
          source: UNIV_YONSEI
          # 학사·일반 공지가 섞인 통합 게시판이라 장학 분류(findClSeq=257)만 수집한다.
          list-url: https://www.yonsei.ac.kr/bbs/sc/58/artclList.do?findClSeq=257
          article-path: /bbs/sc/58/
          # 목록 필터(findClSeq)는 상단 고정 공지에 안 먹는다. 상세의 분류 표기로 한 번 더 거른다.
          include-category: 장학
          max-articles: 10
        - code: hufs
          provider: 한국외국어대학교
          source: UNIV_HUFS
          list-url: https://www.hufs.ac.kr/bbs/hufs/2182/artclList.do
          article-path: /bbs/hufs/2182/
          max-articles: 10
        - code: inu
          provider: 인천대학교
          source: UNIV_INU
          list-url: https://life.inu.ac.kr/bbs/inu/249/artclList.do
          article-path: /bbs/inu/249/
          max-articles: 10
        - code: swu
          provider: 서울여자대학교
          source: UNIV_SWU
          list-url: https://www.swu.ac.kr/bbs/swu/57/artclList.do
          article-path: /bbs/swu/57/
          max-articles: 10
        # 쿼리파라미터 계열(artclView 아님). 같은 페이지에 다른 게시판(학사공지 등) 링크도 있어
        # 목록 자기 게시판의 상대링크(?mode=view...)만 잡도록 ^ 로 고정한다.
        - code: sejong
          provider: 세종대학교
          source: UNIV_SEJONG
          list-url: https://www.sejong.ac.kr/kor/intro/notice7.do?mode=list
          link-pattern: '^\?mode=view&articleNo=(\d+)'
          detail-template: https://www.sejong.ac.kr/kor/intro/notice7.do?mode=view&articleNo={id}
          # 지정 전에는 본문 영역을 못 찾아 페이지 전체(대학 소개문·메뉴)가 본문으로 들어갔다.
          title-selector: ".b-title"
          body-selector: ".fr-view"
          max-articles: 10
        # Tier B: JS 함수형 링크(fnView(날짜, 순번) 복합키). link-pattern 그룹2까지 사용 → {id}/{id2} 치환.
        - code: uos
          provider: 서울시립대학교
          source: UNIV_UOS
          list-url: https://scholarship.uos.ac.kr/scholarship/notice/notice/list.do?brdBbsseq=1&identified=anonymous
          link-pattern: "fnView\\('(\\d+)',\\s*'(\\d+)'\\)"
          detail-template: https://scholarship.uos.ac.kr/scholarship/notice/notice/view.do?brdBbsseq=1&brdDate={id}&brdSeq={id2}&identified=anonymous
          list-param: pageIndex
          # 테이블형 스킨: 제목은 fontBold td, 본문은 hwp 에디터 영역
          title-selector: "td.fontBold"
          body-selector: ".hwp_editor_board_content, .notice_tb_view_contents"
          max-articles: 10
        # goDetail(글번호) 함수형 링크. 상세 페이지는 /article/JANGHAKNOTICE/detail/{id}.
        - code: dongguk
          provider: 동국대학교
          source: UNIV_DONGGUK
          list-url: https://www.dongguk.edu/article/JANGHAKNOTICE/list
          link-pattern: "goDetail\\((\\d+)\\)"
          detail-template: https://www.dongguk.edu/article/JANGHAKNOTICE/detail/{id}
          list-param: pageIndex
          title-selector: ".board_view .tit p"
          body-selector: ".board_view .view_cont"
          max-articles: 10
        # 국민대 장학공지 게시판. href 안의 글번호를 추출한다.
        - code: kookmin
          provider: 국민대학교
          source: UNIV_KOOKMIN
          list-url: https://kookmin.ac.kr/user/kmuNews/notice/7/index.do
          link-pattern: "/user/kmuNews/notice/7/(\\d+)/view\\.do"
          detail-template: https://kookmin.ac.kr/user/kmuNews/notice/7/{id}/view.do
          list-param: currentPageNo
          title-selector: ".board_view .view_tit"
          body-selector: ".board_view .view_cont"
          max-articles: 10
        # 홍익대 공지센터. articleNo 기반 view 링크를 추출한다.
        - code: hongik
          provider: 홍익대학교
          source: UNIV_HONGIK
          # 대학공지의 장학 카테고리(srCategoryId=24)만 수집한다.
          list-url: https://www.hongik.ac.kr/kr/education/notice-undergrad.do?mode=list&srCategoryId=24&srSearchKey=article_title
          link-pattern: "^((?:/kr/(?:education/notice-undergrad|newscenter/notice)\\.do)?\\?mode=view&articleNo=\\d+[^\"'\\s]*)"
          detail-template:
          list-param: article.offset
          title-selector: ".board_view .view_tit, .view_tit, .title, .article-title, h3"
          body-selector: ".board_view .view_cont, .view_cont, .article-view, .content, .contents"
          max-articles: 10
        # 숭실대 SSU:catch 장학 카테고리. WordPress slug 를 상세 식별자로 사용한다.
        - code: ssu
          provider: 숭실대학교
          source: UNIV_SSU
          list-url: https://scatch.ssu.ac.kr/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD/?category=%EC%9E%A5%ED%95%99
          link-pattern: "^(https://scatch\\.ssu\\.ac\\.kr/[^\"'\\s]*[?&]slug=[^\"'\\s&]+[^\"'\\s]*)"
          detail-template:
          list-param: paged
          title-selector: ".bg-white h1, h1"
          body-selector: ".bg-white, .entry-content"
          max-articles: 10

# 대학알리미/공공데이터 학교·학과 마스터 동기화 (온보딩 STEP2 학교·전공 검색의 원천 데이터).
# service-key 는 반드시 환경변수로 주입한다(저장소에 커밋 금지). 미주입 시 동기화만 실패하고 앱 기동에는 영향 없다.
# NOTE: prefix 에 하이픈이 있어 ACADEMIC_INFO_API_SERVICE_KEY 환경변수가 relaxed binding 으로는 잡히지 않는다.
#       따라서 아래처럼 플레이스홀더를 명시해야 주입된다.
academic-info:
  api:
    service-key: ${ACADEMIC_INFO_API_SERVICE_KEY:}
    school-base-url: ${ACADEMIC_INFO_SCHOOL_BASE_URL:https://apis.data.go.kr/B340014/BasicInformationService_2}
    school-path: ${ACADEMIC_INFO_SCHOOL_PATH:/getUniversityCode}
    major-base-url: ${ACADEMIC_INFO_MAJOR_BASE_URL:https://apis.data.go.kr/B340014/BasicInformationService_1}
    major-path: ${ACADEMIC_INFO_MAJOR_PATH:/getUniversityMajorCode}
    page-size: ${ACADEMIC_INFO_PAGE_SIZE:1000}
    max-pages: ${ACADEMIC_INFO_MAX_PAGES:100}
    # 대학 학과 정보 API 의 필수 파라미터(svyYr). 포털에서 조회 가능한 조사년도를 확인해 입력한다.
    survey-year: ${ACADEMIC_INFO_SURVEY_YEAR:2025}

# 알림 생성 배치. 장학금 수집 이후 알림이 만들어지도록 기본 실행 순서를 둔다.
notification:
  scheduled: ${NOTIFICATION_SCHEDULED:true}
  deadline:
    cron: ${NOTIFICATION_DEADLINE_CRON:0 20 11 * * *}        # 매일 오전 11시 20분
  recommendation:
    cron: ${NOTIFICATION_RECOMMENDATION_CRON:0 30 11 * * *} # 매일 오전 11시 30분

# 애플리케이션 공통 설정
app:
  cors:
    # 브라우저 요청을 허용할 출처 목록 (테스트 프론트 등). 환경변수 CORS_ALLOWED_ORIGINS(쉼표구분)로 override
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  sitemap:
    # 검색엔진에 태울 주소는 API(api.*)가 아니라 사용자가 보는 프론트 도메인이다.
    # 네이버는 사이트맵 내 URL 의 도메인이 소유확인한 호스트와 다르면 수집하지 않는다(www 유무까지 일치).
    base-url: ${SITEMAP_BASE_URL:https://wish-connect.com}
    # 프론트 라우팅이 바뀌면 코드가 아니라 여기만 고친다. {id} 가 장학금 id 로 치환된다.
    scholarship-path: ${SITEMAP_SCHOLARSHIP_PATH:/scholarships/{id}}
    # 항상 포함할 고정 페이지(쉼표 구분). 로그인·마이페이지처럼 색인할 이유가 없는 곳은 넣지 않는다.
    static-paths: ${SITEMAP_STATIC_PATHS:/,/scholarships,/insights}
    # 마감 공고도 담는다. 상세 페이지는 마감 후에도 살아 있고, 네이버는 사이트 내 모든 URL 수록을 권장한다.
    # (사이트맵에서 priority 를 낮춰 표기하므로 모집 중인 공고가 먼저 수집된다)
    include-closed: ${SITEMAP_INCLUDE_CLOSED:true}
    # 한 파일 URL 상한(프로토콜·네이버 공통 상한 50,000). XML 을 통째로 캐시하므로 t3.small 기준으로 낮췄다.
    max-urls: ${SITEMAP_MAX_URLS:20000}
    # 생성 결과 캐시. 네이버는 피드 응답이 느리면 제출을 제한한다. 공고는 하루 한 번 갱신되므로 1시간이면 충분하다.
    cache-ttl: ${SITEMAP_CACHE_TTL:1h}
  robots:
    # robots.txt 에서 수집을 막을 경로(쉼표 구분). 프론트 경로 기준으로 적되,
    # 프록시 없이 API 도메인에 그대로 노출되는 경우까지 감안해 API·문서 경로도 함께 막는다.
    disallow-paths: ${ROBOTS_DISALLOW_PATHS:/api/,/admin,/swagger-ui,/v3/api-docs,/auth/}
  mail:
    from: ${MAIL_FROM:no-reply@wish-connect.com}
  email-verification:
    code-ttl-seconds: 300       # 인증 코드 5분
    verified-ttl-seconds: 1800  # 인증완료 상태 30분(회원가입까지)
    cooldown-seconds: 60        # 재발송 제한 간격
