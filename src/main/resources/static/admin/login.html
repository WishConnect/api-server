<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>WishConnect 관리자 로그인</title>
	<style>
		:root{--navy:#17213c;--brand:#536dfe;--bg:#f5f6f8;--line:#e4e7ee;--text:#1d2433;--muted:#7b8498;--red:#e34d59}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,#eef0ff 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
		.login{width:min(420px,calc(100% - 32px));padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px rgba(23,33,60,.09)}
		.logo{display:flex;align-items:center;gap:11px;margin-bottom:30px;font-size:18px;font-weight:800}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#7285ff,#9169ec);color:#fff}
		h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:24px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:700}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #eef0ff}
		button{width:100%;border:0;border-radius:9px;padding:12px;background:var(--brand);color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{display:none;margin-bottom:14px;padding:10px 12px;border-radius:8px;background:#fff0f1;color:var(--red)}.error.show{display:block}.notice{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}
	</style>
</head>
<body>
<main class="login">
	<div class="logo"><span class="mark">W</span>WishConnect Admin</div>
	<h1>관리자 로그인</h1>
	<div class="sub">ADMIN 권한이 있는 LOCAL 계정만 접근할 수 있습니다.</div>
	<div id="error" class="error"></div>
	<form id="loginForm">
		<div class="field"><label for="loginId">아이디</label><input id="loginId" name="loginId" autocomplete="username" required autofocus></div>
		<div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
		<button id="submit" type="submit">로그인</button>
	</form>
	<div class="notice">로그인 정보와 Access Token은 로그에 기록하지 않습니다.</div>
</main>
<script>
	const form = document.getElementById('loginForm');
	const error = document.getElementById('error');
	const submit = document.getElementById('submit');
	form.addEventListener('submit', async (event) => {
		event.preventDefault();
		error.className = 'error';
		submit.disabled = true;
		try {
			const response = await fetch('/api/v1/admin/auth/login', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({loginId: form.loginId.value.trim(), password: form.password.value})
			});
			const body = await response.json().catch(() => null);
			if (!response.ok || !body || body.success === false) {
				throw new Error((body && body.message) || '로그인하지 못했습니다.');
			}
			sessionStorage.setItem('wc_admin_token', body.data.accessToken);
			sessionStorage.setItem('wc_admin_name', body.data.name);
			location.replace('/admin/console');
		} catch (e) {
			error.textContent = e.message;
			error.className = 'error show';
		} finally {
			form.password.value = '';
			submit.disabled = false;
		}
	});
</script>
</body>
</html>
