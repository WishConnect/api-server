name: Deploy to EC2 (prod)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 동시에 여러 배포가 겹치지 않도록 직렬화
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트 포함 빌드: 70개 단위/슬라이스 테스트는 DB/Redis 불필요 → 배포 전 안전망으로 실행
      - name: Build with Gradle (with tests)
        run: ./gradlew clean build

      - name: Prepare deploy jar
        run: cp "$(ls build/libs/*.jar | grep -v plain | head -n 1)" deploy.jar

      - name: Copy jar to EC2 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.jar
          target: /home/ubuntu/app

      - name: Copy pending database migration to EC2 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: src/main/resources/db/migration/V20260819_08__create_content_inquiry.sql
          target: /home/ubuntu/app

      - name: Deploy on EC2 (SSH) + health check + rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          SCHOLARSHIP_API_SERVICEKEY: ${{ secrets.SCHOLARSHIP_API_SERVICEKEY }}
          ACADEMIC_INFO_API_SERVICE_KEY: ${{ secrets.ACADEMIC_INFO_API_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,FRONTEND_ORIGIN,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_REDIRECT_URI,NAVER_SEARCH_CLIENT_ID,NAVER_SEARCH_CLIENT_SECRET,SCHOLARSHIP_API_SERVICEKEY,ACADEMIC_INFO_API_SERVICE_KEY,ANTHROPIC_API_KEY
          script: |
            set -e
            APP_DIR=/home/ubuntu/app
            ENV_DIR=/etc/wishconnect
            MIGRATION_FILE="$APP_DIR/src/main/resources/db/migration/V20260819_08__create_content_inquiry.sql"

            # 1) 시크릿을 EnvironmentFile 로 기록 (root:600, 앱 실행 시 systemd 가 주입)
            sudo mkdir -p "$ENV_DIR"
            sudo tee "$ENV_DIR/wishconnect.env" > /dev/null <<EOF
            SPRING_PROFILES_ACTIVE=prod
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
            KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI}
            NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID}
            NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET}
            SCHOLARSHIP_API_SERVICEKEY=${SCHOLARSHIP_API_SERVICEKEY}
            ACADEMIC_INFO_API_SERVICE_KEY=${ACADEMIC_INFO_API_SERVICE_KEY}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            EOF
            sudo chmod 600 "$ENV_DIR/wishconnect.env"

            # 2) ddl-auto=validate 전에 신규 테이블을 먼저 만든다.
            #    이 SQL은 CREATE IF NOT EXISTS만 사용해 재배포해도 안전하다.
            if ! command -v psql > /dev/null 2>&1; then
              echo "❌ psql is required to apply database migrations"
              exit 1
            fi
            if [ ! -f "$MIGRATION_FILE" ]; then
              echo "❌ Migration file not found: $MIGRATION_FILE"
              exit 1
            fi
            PSQL_URL="${DB_URL#jdbc:}"
            PGPASSWORD="$DB_PASSWORD" psql "$PSQL_URL" -U "$DB_USERNAME" \
              -v ON_ERROR_STOP=1 -f "$MIGRATION_FILE"
            echo "✅ Database migration applied"

            # 3) jar 교체 (현재 버전 백업 유지 → 롤백용)
            mkdir -p "$APP_DIR/logs"
            if [ -f "$APP_DIR/app.jar" ]; then cp "$APP_DIR/app.jar" "$APP_DIR/app.jar.bak"; fi
            mv "$APP_DIR/deploy.jar" "$APP_DIR/app.jar"

            # 4) 재시작. 이전 연속 실패로 start-limit에 걸렸을 수 있어 먼저 해제한다.
            sudo systemctl reset-failed wishconnect || true
            sudo systemctl restart wishconnect

            # 5) 헬스체크 (최대 ~180초 대기)
            #    기동 시간이 기능이 늘면서 계속 길어졌다. 2026-08-17 실측 58초인데 한계가 60초라
            #    멀쩡한 배포가 타임아웃으로 롤백됐다(run 32006812629). 여유를 3배로 둔다.
            #    t3.small 2 vCPU 에서 컨텍스트 로딩만 17초, 전체 58초.
            echo "Health checking /actuator/health ..."
            for i in $(seq 1 36); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "✅ Deploy healthy"
                exit 0
              fi
              echo "  ...attempt $i not ready, retrying in 5s"
              sleep 5
            done

            # 6) 헬스체크 실패 → 실패 원인을 먼저 남기고 이전 jar 로 롤백
            echo "❌ Health check failed — rolling back to previous jar"
            echo "----- failed deployment logs -----"
            sudo journalctl -u wishconnect -n 120 --no-pager || true
            if [ -f "$APP_DIR/app.jar.bak" ]; then
              mv "$APP_DIR/app.jar.bak" "$APP_DIR/app.jar"
              sudo systemctl reset-failed wishconnect || true
              sudo systemctl restart wishconnect || true
            fi
            echo "----- rollback logs -----"
            sudo journalctl -u wishconnect -n 80 --no-pager || true
            exit 1
