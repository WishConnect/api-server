# WishConnect API (api.wish-connect.com) Nginx 사이트 설정 — 이 파일이 원본이다.
#
# 설치 위치: /etc/nginx/sites-available/wishconnect  (sites-enabled/wishconnect 가 이 파일을 가리키는 심볼릭 링크)
# main 배포 시 GitHub Actions 가 서버에 반영한다(백업 → nginx -t → reload → 점검 → 실패 시 복구).
# 서버에서 직접 고치면 다음 배포 때 덮어써진다. 고칠 일이 있으면 여기서 고칠 것. (deploy/README.md)
#
# 이 파일에는 비밀값이 없다. 인증서 개인키는 서버의 /etc/letsencrypt 에만 있고 여기엔 경로만 적는다.

# HTTP → HTTPS
server {
    listen 80;
    server_name api.wish-connect.com;
    server_tokens off;

    # 리다이렉트를 server 레벨 return 이 아니라 location / 안에 둔다.
    # certbot(nginx 플러그인)이 갱신 때 끼워 넣는 /.well-known/acme-challenge/ 정확 일치 location 이
    # 이 리다이렉트보다 먼저 잡히게 하기 위해서다.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.wish-connect.com;

    # 응답 헤더 Server: nginx/1.24.0 (Ubuntu) → nginx (버전 숨김, QA S9)
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.wish-connect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wish-connect.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 요청 본문 한도. 기본값 1m 때문에 1MB 넘는 포스터 업로드가 413 으로 막혔다.
    # 앱 한도(multipart 파일 5MB / 요청 6MB, application.yml)보다 커야 앱이 친절한 400 문구를 낼 수 있다.
    # 순서: Nginx(10m) ≥ Spring 요청(6MB) ≥ Spring 파일(5MB)
    client_max_body_size 10m;

    # ── 외부에 열지 않는 경로 ───────────────────────────────────────────────
    # 관리자 콘솔(/admin/console, /admin/login.html, /admin/admin-console.js)은 도메인으로 쓴다.
    # 그래서 /admin/ 접두사 전체를 막지 않고, 예전 콘솔 파일만 정확히 일치(=)로 막는다.
    location = /admin/index.html          { return 404; }  # 토큰 붙여넣기 방식의 예전 콘솔(코드에서 삭제됨)
    location = /admin/layout-preview.html { return 404; }  # 현재 콘솔 파일이 정적 경로로도 열리던 것

    # API 문서. 운영 앱에서도 꺼져 있지만(application-prod.yml) 설정 실수에 대비해 여기서도 막는다.
    # ^~ : 접두사 일치 시 정규식 location 검사를 건너뛴다. /swagger-ui.html, /swagger-ui/**, /v3/api-docs/** 포함.
    location ^~ /swagger-ui  { return 404; }
    location ^~ /v3/api-docs { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for 를 쓰지 않는다. 그건 클라이언트가 보낸 X-Forwarded-For 뒤에 덧붙이는데,
        # 앱(forward-headers-strategy: framework)은 맨 앞 값을 클라이언트 IP 로 쓰므로
        # 헤더를 위조하면 관리자 로그인 IP 실패 제한을 우회할 수 있다.
        # 이 Nginx 가 맨 앞단(CloudFront·LB 없음)이므로 접속 주소로 덮어쓴다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
